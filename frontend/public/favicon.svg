<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="#1AACBA">
  <!--
    Zastiply logo - teal interlocked geometric monogram
    Traced from original: two interlocked rectangular path shapes, rotated ~42deg
  -->
  <g transform="translate(100,100) rotate(42) translate(-45,-60)">
    <!-- === UPPER PIECE (top-left bracket) === -->
    <!-- Top horizontal bar -->
    <rect x="0"  y="0"  width="60" height="10"/>
    <!-- Left vertical bar -->
    <rect x="0"  y="0"  width="10" height="42"/>
    <!-- Upper right vertical bar -->
    <rect x="50" y="0"  width="10" height="32"/>
    <!-- Middle horizontal bar (upper) -->
    <rect x="0"  y="32" width="60" height="10"/>

    <!-- === LOWER PIECE (bottom-right bracket, mirrored) === -->
    <!-- Middle horizontal bar (lower) -->
    <rect x="30" y="58" width="60" height="10"/>
    <!-- Right vertical bar -->
    <rect x="80" y="58" width="10" height="42"/>
    <!-- Lower left vertical bar -->
    <rect x="30" y="68" width="10" height="32"/>
    <!-- Bottom horizontal bar -->
    <rect x="30" y="90" width="60" height="10"/>
  </g>
</svg>