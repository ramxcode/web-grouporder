<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Geometric icon (teal interlocked Z shape) -->
  <g transform="translate(8,8)">
    <g transform="translate(40,42) rotate(42) translate(-26,-36)" fill="#1AACBA">
      <!-- Upper bracket piece -->
      <rect x="0"  y="0"  width="44" height="7.5"/>
      <rect x="0"  y="0"  width="7.5" height="30"/>
      <rect x="36.5" y="0"  width="7.5" height="22.5"/>
      <rect x="0"  y="22.5" width="44" height="7.5"/>
      <!-- Lower bracket piece -->
      <rect x="12" y="42" width="44" height="7.5"/>
      <rect x="48.5" y="42" width="7.5" height="30"/>
      <rect x="12" y="57" width="7.5" height="22.5"/>
      <rect x="12" y="64.5" width="44" height="7.5"/>
    </g>
  </g>

  <!-- Vertical divider -->
  <line x1="106" y1="18" x2="106" y2="82" stroke="white" stroke-width="1.2" opacity="0.3"/>

  <!-- ZASTIPLY text — white for sidebar dark background -->
  <text
    x="124"
    y="64"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="34"
    letter-spacing="2.5"
    fill="white"
  >ZASTIPLY</text>
</svg>
